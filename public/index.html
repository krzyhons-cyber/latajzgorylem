  /* ============================== UTILS ================================= */

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

  }

  var DIACRITICS = { "ą":"a","ć":"c","ę":"e","ł":"l","ń":"n","ó":"o","ś":"s","ź":"z","ż":"z" };
  function slugify(text, existingSlugs, ignoreSlug) {
    var base = String(text || "").toLowerCase().split("").map(function (ch) {
      return DIACRITICS[ch] || ch;
    }).join("");
    base = base.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    if (!base) base = "oferta";
    var slug = base, n = 2;
    var taken = {};
    (existingSlugs || []).forEach(function (s) { if (s !== ignoreSlug) taken[s] = true; });
    while (taken[slug]) { slug = base + "-" + n; n++; }
    return slug;
  }

  function formatPrice(amount, currency) {
    if (typeof amount !== "number" || isNaN(amount)) return "—";
    var formatted = Math.round(amount).toLocaleString("pl-PL");
    var symbol = CURRENCY_SYMBOLS[currency] || currency || "zł";
    return (currency === "EUR" || currency === "USD" || currency === "GBP")
      ? symbol + formatted
      : formatted + " " + symbol;
  }

  function discountPercent(original, current) {
    if (typeof original !== "number" || typeof current !== "number") return 0;
    if (original <= 0 || current >= original) return 0;
    return Math.round(((original - current) / original) * 100);
  }

  function daysLeftText(validUntil) {
    if (!validUntil) return "";
    var target = new Date(validUntil);
    if (isNaN(target.getTime())) return "";
    var now = new Date();
    var diff = Math.ceil((target.setHours(23,59,59,999) - now.getTime()) / 86400000);
    if (diff < 0) return "Oferta wygasła";
    if (diff === 0) return "Ostatni dzień!";
    if (diff === 1) return "Zostaje 1 dzień";
    if (diff <= 4) return "Zostały " + diff + " dni";
    return "Zostało " + diff + " dni";
  }

  /* ===================== ADDED DATE, PROVIDER GUESS ======================== */

  function addedLong(iso) {
    var d = new Date(iso);

      ", " + d.toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });
  }
  function addedShort(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString("pl-PL", { day: "numeric", month: "short", year: "numeric" });
  }

  function validShort(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString("pl-PL", { day: "numeric", month: "long", year: "numeric" });
  }
  // short readable address of the offer page, e.g. latajzgorylem.pl/oferta/egipt
  function offerDisplayUrl(slug) { return location.host.replace(/^www\./, "") + "/oferta/" + slug; }
  function cutText(t, n) { t = String(t || "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1).replace(/[\s,.;:\-–—]+$/, "") + "…" : t; }
  // up to 2 short detail lines for the image cards
  function cardDetails(o) {
    var out = [];

    if (first) out.push(first);
    var meta = [];
    if (tripShort(o)) out.unshift("🗓 " + tripShort(o));
    if (o.provider) meta.push("Oferta: " + cutText(o.provider, 24));
    if (o.validUntil && validShort(o.validUntil)) meta.push("do " + validShort(o.validUntil));
    if (meta.length) out.push(meta.join("  ·  "));
    return out.slice(0, 2);
  }

  // ---- trip dates (date pickers) ----
  function parseDay(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function nightsText(n) {
    if (!(n > 0)) return "";
    var last = n % 10, teen = n % 100 >= 12 && n % 100 <= 14;
    return n + (n === 1 ? " noc" : (last >= 2 && last <= 4 && !teen ? " noce" : " nocy"));
  }
  function tripRangeText(from, to) {
    var a = parseDay(from), b = parseDay(to);
    var mon = function (d) { return d.toLocaleDateString("pl-PL", { day: "numeric", month: "long" }).replace(/^\d+\.?\s*/, ""); }; // genitive: "listopada"
    if (a && b && b >= a) {
      if (a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()) return a.getDate() + "–" + b.getDate() + " " + mon(b) + " " + b.getFullYear();
      if (a.getFullYear() === b.getFullYear()) return a.getDate() + " " + mon(a) + " – " + b.getDate() + " " + mon(b) + " " + b.getFullYear();
      return a.getDate() + " " + mon(a) + " " + a.getFullYear() + " – " + b.getDate() + " " + mon(b) + " " + b.getFullYear();
    }
    var one = a || b;
    return one ? (a ? "od " : "do ") + one.getDate() + " " + mon(one) + " " + one.getFullYear() : "";
  }
  // one short line for the description, e.g. "🗓 Termin wyjazdu: 12–19 listopada 2026 (7 nocy)."
  function tripLine(from, to) {
    var r = tripRangeText(from, to);
    if (!r) return "";
    var a = parseDay(from), b = parseDay(to), n = a && b && b > a ? Math.round((b - a) / 86400000) : 0;
    return "🗓 Termin wyjazdu: " + r + (n ? " (" + nightsText(n) + ")" : "") + ".";
  }
  // ---- rozbicie ceny: lot (za osobę), nocleg (za całość) … i liczba osób ----
  var PRICE_KINDS = {
    flight: { icon: "✈️", label: "Lot", basis: "person" },
    hotel: { icon: "🏨", label: "Nocleg", basis: "total" },
    car: { icon: "🚗", label: "Auto", basis: "total" },
    other: { icon: "➕", label: "Inne", basis: "total" }
  };
  function computePricing(pr) {
    var people = Math.max(1, Math.round(Number(pr.people)) || 1), total = 0;
    var items = (pr.items || []).filter(function (x) { return x && typeof x.amount === "number" && !isNaN(x.amount) && x.amount >= 0; });
    items.forEach(function (x) { total += x.basis === "person" ? x.amount * people : x.amount; });
    var hl = pr.headline === "total" || pr.headline === "person" ? pr.headline : "manual";
    return { people: people, items: items, total: total, perPerson: total / people, headline: hl };
  }
  function pricingOf(o) {
    if (!o || !o.pricing || !o.pricing.items || !o.pricing.items.length) return null;
    var c = computePricing(o.pricing);

  }
  // tekst przy dużej cenie: "na osobę" / "dla 2 osób"
  function priceUnit(o) {
    var c = pricingOf(o);
    if (!c) return "";
    if (c.headline === "person") return "na osobę";
    if (c.headline === "total" && c.people > 1) return "dla " + c.people + " osób";
    return "";
  }
  function priceWithUnit(o) { var u = priceUnit(o); return formatPrice(o.currentPrice, o.currency) + (u ? " " + u : ""); }
  function pricingLine(o) {
    var c = pricingOf(o);
    if (!c || c.people < 2) return "";
    return formatPrice(c.total, o.currency) + " dla " + c.people + " osób · " + formatPrice(c.perPerson, o.currency) + " na osobę";
  }
  function priceUnitHtml(o) { var u = priceUnit(o); return u ? ' <small class="price-unit">' + escapeHtml(u) + "</small>" : ""; }
  function priceBreakdownHtml(offer) {
    var c = pricingOf(offer);
    if (!c) return "";
    var cur = offer.currency;
    var rows = c.items.map(function (x) {
      var k = PRICE_KINDS[x.kind] || PRICE_KINDS.other;
      var sub = x.basis === "person"
        ? (c.people > 1 ? formatPrice(x.amount, cur) + " × " + c.people + " os." : "cena za osobę")
        : (c.people > 1 ? "cena za całość (" + c.people + " os.)" : "cena za całość");
      var line = x.basis === "person" ? x.amount * c.people : x.amount;
      return '<div class="pr-row"><span>' + k.icon + " " + escapeHtml(k.label + (x.label ? " — " + x.label : "")) + "<small>" + escapeHtml(sub) + '</small></span><b class="mono">' + formatPrice(line, cur) + "</b></div>";
    }).join("");
    return '<div class="pricing-box"><div class="pricing-title">Z czego składa się cena</div>' + rows +
      '<div class="pr-sum"><span>Razem' + (c.people > 1 ? " dla " + c.people + " osób" : "") + '</span><b class="mono">' + formatPrice(c.total, cur) + "</b></div>" +
      (c.people > 1 ? '<div class="pr-pp"><span>Na osobę</span><b class="mono">' + formatPrice(c.perPerson, cur) + "</b></div>" : "") + "</div>";
  }
  function pricingLineHtml(o) { var l = pricingLine(o); return l ? '<div class="added">👥 ' + escapeHtml(l) + "</div>" : ""; }

  // ---- dodatkowe terminy lotów (offer.terms) ----
  function pluralTerms(n) { var l = n % 10, teen = n % 100 >= 12 && n % 100 <= 14; return n + (n === 1 ? " termin" : (l >= 2 && l <= 4 && !teen ? " terminy" : " terminów")); }
  // przyszłe terminy oferty; withMain = dołącz główny termin (dateFrom/dateTo), jeśli go nie ma na liście
  function offerTerms(o, withMain) {
    var today = todayIso();
    var list = (o.terms || []).filter(function (x) { return x && x.from; }).map(function (x) { return Object.assign({}, x); });
    if (withMain && o.dateFrom && !list.some(function (x) { return x.from === o.dateFrom && (x.to || "") === (o.dateTo || ""); })) {
      list.push({ from: o.dateFrom, to: o.dateTo || "", price: o.currentPrice, url: "", main: true });
    }
    list = list.filter(function (x) { return (x.to || x.from) >= today; });
    list.sort(function (a, b) { return a.from < b.from ? -1 : (a.from > b.from ? 1 : 0); });
    return list;
  }
  function termWhen(x) {

    return { range: tripRangeText(x.from, x.to), nights: n ? nightsText(n) : "" };
  }
  function termsSectionHtml(offer) {
    if (!(offer.terms || []).length) return "";
    var list = offerTerms(offer, true);
    if (!list.length) return "";
    var mainUrl = (getOfferLinks(offer)[0] || {}).url || "";
    var prices = list.map(function (x) { return typeof x.price === "number" && !isNaN(x.price) ? x.price : null; }).filter(function (v) { return v !== null; });
    var cheapest = prices.length > 1 ? Math.min.apply(null, prices) : null;
    return '<div class="terms-section"><h2>📅 Dostępne terminy</h2><div class="terms-list">' +

  function tripShort(o) {

  // ---- drafts & scheduled publication ----
  // Moment, od którego oferta jest widoczna: data dodania albo (dla zaplanowanych) data publikacji
  function offerTs(o) { var c = Date.parse(o.createdAt) || 0, pa = Date.parse(o.publishAt) || 0; return pa && pa <= Date.now() ? Math.max(c, pa) : c; }

  function statusLabel(o) {

  }
  function publishFieldsHtml(prefix, o) {

        '<option value="draft"' + (mode === "draft" ? " selected" : "") + ">Zapisz jako szkic (niewidoczna na stronie)</option>" +
        '<option value="schedule"' + (mode === "schedule" ? " selected" : "") + ">Zaplanuj publikację na datę i godzinę…</option>" +
      "</select>" +
      '<input id="' + prefix + '_pubAt" type="datetime-local" style="margin-top:6px" value="' + escapeHtml(mode === "schedule" ? toLocalInput(o.publishAt) : "") + '"' + (mode === "schedule" ? "" : " hidden") + ">" +
      '<span class="hint">Szkic i oferta zaplanowana są widoczne tylko dla Ciebie w panelu. Zaplanowana pojawi się sama o wybranej godzinie.</span></div>';
  }

    { keys: ["norwegia", "norway", "islandia", "iceland", "szwecja", "sweden"], scene: "mountains", accent: "#3f6b8f" }
  ];

  function normalizeForMatch(s) {
    var ascii = String(s || "").toLowerCase().split("").map(function (ch) {
      return DIACRITICS[ch] || ch;
    }).join("");
    return ascii.replace(/[^a-z0-9]+/g, " ").trim();
  }

  function tokenize(s) {
    return normalizeForMatch(s).split(" ").filter(function (w) { return w.length >= 3; });
  }

  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }

  function shadeHex(hex, percent) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    function adj(c) { return percent >= 0 ? c + (255 - c) * (percent / 100) : c * (1 + percent / 100); }
    r = Math.min(255, Math.max(0, Math.round(adj(r))));
    g = Math.min(255, Math.max(0, Math.round(adj(g))));
    b = Math.min(255, Math.max(0, Math.round(adj(b))));
    return "#" + [r, g, b].map(function (v) { return ("0" + v.toString(16)).slice(-2); }).join("");
  }

  function pickDestinationTheme(offer) {
    var text = normalizeForMatch((offer.destination || "") + " " + (offer.title || ""));
    for (var i = 0; i < DESTINATION_THEMES.length; i++) {
      var theme = DESTINATION_THEMES[i];
      for (var k = 0; k < theme.keys.length; k++) {
        if (text.indexOf(theme.keys[k]) !== -1) return theme;
      }
    }
    var fallbackScenes = { flights: "skyline", hotels: "domes", packages: "beach", holidays: "beach", carRental: "mountains", attractions: "domes" };
    var accentPalette = ["#3f6b8f", "#c0652f", "#2f8f9d", "#8a4b4b", "#3a7d44", "#6b5b95", "#d98a3d", "#1f7a8c"];
    var h = hashStr(text || offer.slug || "x");
    return {
      scene: fallbackScenes[offer.category] || ["skyline", "domes", "beach", "mountains", "desert", "canal"][h % 6],
      accent: accentPalette[h % accentPalette.length]
    };
  }

  function sceneSvg(scene, accent, seed) {
    var light = shadeHex(accent, 40), dark = shadeHex(accent, -32), fg = shadeHex(accent, -46);
    var gid = "sky" + seed.replace(/[^a-zA-Z0-9]/g, "");
    var defs = '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + light + '"/><stop offset="1" stop-color="' + dark + '"/></linearGradient></defs>';
    var out = '<rect width="400" height="300" fill="url(#' + gid + ')"/>';
    if (scene === "skyline") {
      var heights = [70, 110, 85, 130, 95, 75, 105], x = 6;
      heights.forEach(function (h) { out += '<rect x="' + x + '" y="' + (232 - h) + '" width="42" height="' + h + '" fill="' + fg + '"/>'; x += 48; });
    } else if (scene === "domes") {
      out += '<circle cx="200" cy="172" r="54" fill="' + fg + '"/><rect x="152" y="172" width="96" height="60" fill="' + fg + '"/>';
      for (var i = 0; i < 6; i++) { out += '<rect x="' + (22 + i * 60) + '" y="192" width="16" height="40" fill="' + fg + '"/>'; }
    } else if (scene === "beach") {
      out += '<circle cx="322" cy="68" r="34" fill="' + light + '"/>' +
        '<path d="M0 232 Q100 202 200 232 T400 232 V300 H0 Z" fill="' + fg + '"/>' +
        '<path d="M80 232 C80 190 60 170 75 150" stroke="' + fg + '" stroke-width="7" fill="none"/>' +
        '<path d="M80 165 L110 150 M80 170 L50 160 M80 175 L108 185" stroke="' + fg + '" stroke-width="6" fill="none" stroke-linecap="round"/>';
    } else if (scene === "mountains") {
      out += '<polygon points="0,232 90,112 170,232" fill="' + fg + '"/>' +
        '<polygon points="120,232 230,72 330,232" fill="' + fg + '" opacity="0.88"/>' +
        '<polygon points="260,232 340,142 400,232" fill="' + fg + '"/>';
    } else if (scene === "desert") {
      out += '<circle cx="330" cy="68" r="32" fill="' + light + '"/>' +
        '<polygon points="140,232 192,128 244,232" fill="' + fg + '"/>' +
        '<polygon points="60,232 112,150 164,232" fill="' + fg + '" opacity="0.85"/>' +
        '<polygon points="220,232 272,160 324,232" fill="' + fg + '" opacity="0.7"/>';
    } else if (scene === "canal") {
      var hx = 10;
      for (var j = 0; j < 7; j++) {
        var hh = 90 + (j % 3) * 22;
        out += '<rect x="' + hx + '" y="' + (232 - hh) + '" width="46" height="' + hh + '" fill="' + fg + '"/>' +
          '<polygon points="' + hx + ',' + (232 - hh) + ' ' + (hx + 23) + ',' + (232 - hh - 24) + ' ' + (hx + 46) + ',' + (232 - hh) + '" fill="' + fg + '"/>';
        hx += 52;
      }
    }
    out += '<rect y="226" width="400" height="74" fill="' + fg + '" opacity="0.18"/>';
    return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">' + defs + out + '</svg>';
  }

  function destinationArt(offer) {
    var theme = pickDestinationTheme(offer);
    return sceneSvg(theme.scene, theme.accent, offer.slug || "x");
  }

  window.__handleThumbImgError = function (imgEl) {
    var slug = imgEl.getAttribute("data-art-slug");
    var offer = activeOffers().find(function (o) { return o.slug === slug; });

  /* ============================ CROSS-SELL =============================== */
  /* After viewing an offer, automatically suggest a matching car rental
     (and, for non-hotel offers, a matching place to stay) — picked from
     the owner's own offers by shared destination keywords, falling back
     to a site-wide partner link set once in "Ustawienia strony". Shown
     only when a real match or a configured fallback link exists. */

  function findBestMatch(offer, category) {
    var tokens = tokenize(offer.destination || "");
    var candidates = publicOffers().filter(function (o) { return o.category === category && o.slug !== offer.slug; });
    var best = null, bestScore = 0;
    candidates.forEach(function (c) {
      var ctoks = tokenize(c.destination || "");
      var score = tokens.filter(function (t) { return ctoks.indexOf(t) !== -1; }).length;
      if (score > bestScore) { bestScore = score; best = c; }
    });
    return best;
  }

  var LINK_TYPES = {
    flights: { label: "Loty", icon: "✈️", cta: "Sprawdź loty" },
    hotel: { label: "Nocleg", icon: "🏨", cta: "Zarezerwuj nocleg" },
    car: { label: "Wynajem auta", icon: "🚗", cta: "Wynajmij auto" },
    attractions: { label: "Atrakcje", icon: "🎫", cta: "Kup bilety na atrakcje" },
    other: { label: "Inna oferta", icon: "🔗", cta: "Przejdź do oferty" }
  };
  var LINK_TYPE_ORDER = ["flights", "hotel", "car", "attractions", "other"];
  var CATEGORY_DEFAULT_LINK = { flights: "flights", hotels: "hotel", packages: "other", holidays: "other", carRental: "car", attractions: "attractions" };

  // Every offer can carry several affiliate links. Older offers that only
  // have a single affiliateUrl are treated as having one link.
  function getOfferLinks(offer) {
    var out = [];
    if (offer.links && offer.links.length) {
      offer.links.forEach(function (l) {
        if (l && l.url) { var lk = { type: LINK_TYPES[l.type] ? l.type : "other", label: l.label || "", url: l.url }; if (l.auto) lk.auto = true; out.push(lk); }
      });
    }
    if (!out.length && offer.affiliateUrl) {
      out.push({ type: CATEGORY_DEFAULT_LINK[offer.category] || "other", label: "", url: offer.affiliateUrl });
    }
    return out;
  }

  function buildCrossSell(offer) {
    var result = {};
    var settings = state.settings || {};
    var ownLinks = getOfferLinks(offer);
    var extras = offer.extras || [];
    var hasOwnCar = ownLinks.some(function (l) { return l.type === "car"; }) || extras.some(function (x) { return x && x.type === "car" && x.url; });
    var hasOwnHotel = ownLinks.some(function (l) { return l.type === "hotel"; }) || extras.some(function (x) { return x && x.type === "hotel" && x.url; });
    if (offer.category !== "carRental" && !hasOwnCar) {
      var carMatch = findBestMatch(offer, "carRental");
      if (carMatch) result.car = { kind: "offer", offer: carMatch };
      else if (settings.defaultCarRentalUrl) result.car = { kind: "generic", url: settings.defaultCarRentalUrl, label: settings.defaultCarRentalLabel || "Wynajem samochodu" };
    }
    if (offer.category !== "hotels" && !hasOwnHotel) {
      var hotelMatch = findBestMatch(offer, "hotels");
      if (hotelMatch) result.hotel = { kind: "offer", offer: hotelMatch };
      else if (settings.defaultHotelUrl) result.hotel = { kind: "generic", url: settings.defaultHotelUrl, label: settings.defaultHotelLabel || "Nocleg" };
    }
    return result;

  function currentRoute() {
    var path = location.pathname || "/";
    try { path = decodeURIComponent(path); } catch (e) {}

    var m = path.match(/^\/oferta\/(.+)$/);
    if (m) return { name: "offer", slug: m[1] };
    if (path === "/admin") return { name: "admin" };

  function readAndShrinkImage(file, cb, maxWidth, quality) {
    var reader = new FileReader();
    reader.onerror = function () { cb(null); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { cb(null); };
      img.onload = function () {
        var maxW = maxWidth || 1000, scale = Math.min(1, maxW / img.width);
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        var dataUrl;
        try { dataUrl = canvas.toDataURL("image/jpeg", quality || 0.78); } catch (e) { cb(null); return; }
        if (!SB.enabled()) { cb(dataUrl); return; }
        SB.uploadDataUrl(dataUrl).then(function (url) { cb(url); }, function () { cb(null); });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

          '<div class="field"><label for="l_pass">Hasło</label><input id="l_pass" type="password" autocomplete="current-password" required></div>' +
          '<div id="loginMsg"></div>' +
          '<div class="form-actions"><button type="submit" class="btn primary">Zaloguj się</button></div>' +
        '</form>' +
      '</div>';
    byId("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = qs("button[type=submit]", byId("loginForm"));
      btn.disabled = true;

  function setEditMode(on) {
    canEditPage = !!on;

  function renderAdmin(canEdit) {
    if (!canEdit) { renderLogin(); return; }
    var draft = emptyDraft();
    var editing = false;
    if (adminEditingSlug) {
      var existing = activeOffers().find(function (o) { return o.slug === adminEditingSlug; });
      if (existing) {
        draft = Object.assign(emptyDraft(), existing, { originalPrice: existing.originalPrice || "", links: getOfferLinks(existing), extras: existing.extras || [] });
        editing = true;
      } else adminEditingSlug = null;
    } else if (adminDuplicateSlug) {
      var src = activeOffers().find(function (o) { return o.slug === adminDuplicateSlug; });
      if (src) {
        var copy = JSON.parse(JSON.stringify(src));
        draft = Object.assign(emptyDraft(), copy, { title: src.title + " (kopia)", originalPrice: src.originalPrice || "", links: getOfferLinks(src), extras: src.extras || [], featured: false, status: "published", publishAt: "" });
        editing = true;
      } else adminDuplicateSlug = null;
    }
    draftImage = draft.image || "";
    var flash = adminFlash;
    adminFlash = null;

    byId("view").innerHTML =
      '<div class="admin-grid"><div>' +
        (flash ? '<div class="msg ok">' + flash + "</div>" : "") +
        (editing ? "" : renderQuickAdd()) +
        '<details class="adv-box" id="advBox"' + (editing ? " open" : "") + "><summary>Pełny formularz (wszystkie pola)</summary>" + renderAdminForm(draft) + "</details>" +
        renderSettingsForm() +
        renderSubscribersCard() +
      "</div><div>" + renderStatsCard() + renderAdminList() + "</div></div>";
    wireAdminEvents();
    wireQuickAdd();
    wireSubscribers();
    loadAdminStats();
  }

  function autoTitle(type, o) {
    var price = formatPrice(o.price, o.currency);
    if (type === "flight") return "Tanie loty " + (o.from ? o.from + " → " : "do ") + o.city + " od " + price;
    if (type === "hotel") return "Nocleg: " + o.city + " od " + price;
    if (type === "car") return "Wynajem auta: " + o.city + " od " + price + " za dobę";
    if (type === "holiday") return "Wczasy: " + o.city + " od " + price;
    return "Wyjazd: " + o.city + " za " + price;

      hotel: "Propozycja noclegu w lokalizacji: " + o.city + ".",
      car: "Wynajem auta — " + o.city + ".",
      holiday: "Wczasy z biura podróży — " + o.city + ".",
      package: "Propozycja wyjazdu — " + o.city + "."

    return lead + " Cena " + formatPrice(o.price, o.currency) + " obowiązywała w dniu publikacji (" + addedLong(new Date().toISOString()) +
      "). Ceny i dostępność zmieniają się dynamicznie — kliknij przycisk, aby sprawdzić aktualną cenę i wolne terminy u partnera.";
  }

  function nextMonthValue() {
    var d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() + 1);
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2);
  }

  function todayIso() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function addDaysIso(iso, n) {
    var p = iso.split("-"), d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]) + n);
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function daysBetweenIso(a, b) { return Math.round((Date.parse(b + "T12:00:00") - Date.parse(a + "T12:00:00")) / 864e5); }

  function wireFlightFinder(P, fill, addTerm) {
    var $ = function (n) { return byId(P + "_" + n); };
    if (!$("go")) return;
    var results = [];
    function msg(kind, text) { $("msg").innerHTML = text ? '<div class="msg ' + kind + '">' + escapeHtml(text) + "</div>" : ""; }

    ["from", "to"].forEach(function (n) {
      var input = $(n), list = $(n + "_list"), timer = null;
      input.addEventListener("input", function () {
        clearTimeout(timer);
        var term = input.value.trim();
        if (term.length < 2 || /\([A-Za-z]{3}\)\s*$/.test(term)) return;
        timer = setTimeout(function () {
          SB.callFn("flights", { action: "suggest", term: term }).then(function (res) {
            list.innerHTML = (res || []).map(function (pl) {
              var label = pl.name + (pl.country ? ", " + pl.country : "") + " (" + pl.code + ")";
              return '<option value="' + escapeHtml(label) + '"></option>';
            }).join("");
          }, function (err) { msg("err", ffFnError(err)); });
        }, 300);
      });
    });

    function syncMode() {
      var dates = $("mode").value === "dates";
      $("monthBox").style.display = dates ? "none" : "";
      $("datesBox").style.display = dates ? "" : "none";
    }
    $("mode").addEventListener("change", syncMode); syncMode();
    $("dep").addEventListener("change", function () {
      var b = $("back");
      if (b.value && b.value < this.value) b.value = this.value;
      b.min = this.value || todayIso();
    });

    function showResults(list, requestedDep) {
      results = list;
      $("results").innerHTML = list.map(function (r, i) {
        var dep = String(r.departure_at || "").slice(0, 10), ret = String(r.return_at || "").slice(0, 10);
        var when = ffDate(r.departure_at) + (r.return_at ? " → " + ffDate(r.return_at) : "");
        var stay = dep && ret ? nightsText(daysBetweenIso(dep, ret)) : "";
        var stops = r.transfers === 0 ? "bez przesiadek" : (r.transfers ? r.transfers + " przesiadk" + (r.transfers === 1 ? "a" : "i") : "");
        var exact = requestedDep && dep === requestedDep ? ' <span class="ff-badge">wybrany termin</span>' : "";
        return '<div class="ff-row"><div><b class="mono">' + escapeHtml(formatPrice(r.price, r.currency || "PLN")) + "</b> · " + escapeHtml(when) + exact +
          (stay ? " · " + escapeHtml(stay) : "") + (r.airline ? " · " + escapeHtml(r.airline) : "") + (stops ? " · " + escapeHtml(stops) : "") + "</div>" +
          '<span class="ff-actions"><button type="button" class="btn primary small" data-ff-use="' + i + '">Użyj</button> ' +
          '<button type="button" class="btn ghost small" data-ff-term="' + i + '" title="Dodaj jako dodatkowy dostępny termin">+ Termin</button></span></div>';
      }).join("") + (list.length > 1 ? '<div style="margin-top:8px"><button type="button" class="btn ghost small" data-ff-termall="1">+ Dodaj wszystkie jako terminy</button></div>' : "");
    }

    $("go").addEventListener("click", function () {
      var o = ffCode($("from").value), d = ffCode($("to").value);
      if (!o || !d) { msg("err", "Wybierz miejsce z podpowiedzi (lub wpisz kod lotniska, np. WAW)."); return; }
      var direct = $("direct").checked, btn = $("go");
      try { localStorage.setItem("traveldeals.ffFrom", $("from").value.trim()); } catch (e) {}
      var calls, requestedDep = "";

      if ($("mode").value === "dates") {
        var dep = $("dep").value, back = $("back").value;
        if (!dep) { msg("err", "Wybierz datę wylotu."); return; }
        if (dep < todayIso()) { msg("err", "Data wylotu jest z przeszłości."); return; }
        if (back && back < dep) { msg("err", "Data powrotu nie może być wcześniejsza niż wylotu."); return; }
        var flex = parseInt($("flex").value, 10) || 0;
        requestedDep = dep;
        calls = [];
        for (var k = -flex; k <= flex; k++) {
          var dk = addDaysIso(dep, k);
          if (dk < todayIso()) continue;
          calls.push({ departure_at: dk, return_at: back ? addDaysIso(back, k) : undefined });
        }
      } else {
        var month = $("month").value;
        if (!month) { msg("err", "Wybierz miesiąc wylotu."); return; }

      }

      btn.disabled = true; msg("", ""); $("results").innerHTML = '<span class="hint">Szukam…</span>';
      var errors = [];
      Promise.all(calls.map(function (c) {
        return SB.callFn("flights", { action: "prices", origin: o, destination: d, departure_at: c.departure_at, return_at: c.return_at, direct: direct })
          .then(function (res) { return res || []; }, function (err) { errors.push(err); return []; });
      })).then(function (lists) {
        btn.disabled = false;
        var seen = {}, all = [];
        lists.forEach(function (l) { l.forEach(function (r) { var key = r.url || (r.departure_at + r.price); if (!seen[key]) { seen[key] = 1; all.push(r); } }); });
        all.sort(function (a, b) { return a.price - b.price; });
        all = all.slice(0, 15);
        if (!all.length) {
          $("results").innerHTML = "";
          if (errors.length && errors.length === calls.length) msg("err", ffFnError(errors[0]));
          else msg("err", requestedDep ? "Brak zapisanych cen dla tych dat. Spróbuj elastyczność ±2 dni albo tryb „Najtańszy w miesiącu”." : "Brak cen dla tej trasy i miesiąca. Spróbuj inny miesiąc lub trasę.");
          return;
        }
        showResults(all, requestedDep);
      });
    });

    $("check").addEventListener("click", function () {
      msg("", ""); $("results").innerHTML = '<span class="hint">Sprawdzam…</span>';
      SB.callFn("flights", { action: "status" }).then(function (r) {
        var line = function (ok, text) { return "<div>" + (ok ? "✅ " : "❌ ") + escapeHtml(text) + "</div>"; };
        $("results").innerHTML =
          line(true, "Funkcja „flights” działa, a Ty jesteś zalogowany") +
          line(r.token, r.token ? "Sekret TRAVELPAYOUTS_TOKEN jest ustawiony" : "Brak sekretu TRAVELPAYOUTS_TOKEN") +
          line(r.marker, r.marker ? "Sekret TRAVELPAYOUTS_MARKER jest ustawiony" : "Brak sekretu TRAVELPAYOUTS_MARKER") +
          line(r.trs, r.trs ? "Sekret TRAVELPAYOUTS_TRS jest ustawiony (automatyczna zamiana linków działa)" : "Brak sekretu TRAVELPAYOUTS_TRS (potrzebny tylko do automatycznej zamiany linków np. z Trip.com)") +
          line(r.travelpayouts === "ok", "Travelpayouts: " + (r.travelpayouts === "ok" ? "token przyjęty" : r.travelpayouts));
      }, function (err) { $("results").innerHTML = ""; msg("err", ffFnError(err)); });
    });

    $("results").addEventListener("click", function (e) {
      var tb = e.target.closest("[data-ff-term]"), ta = e.target.closest("[data-ff-termall]");
      if (tb || ta) {

        return;

    });
  }

  /* ====================== SHARE THUMBNAIL (OG IMAGE) ======================
     Facebook needs one public image per link. For every offer we draw a
     1200x630 card (photo or destination art + title + price + date), upload
     it to Storage and remember its address in offer.ogImage. The public
     page /oferta/<slug> then serves it as og:image. */

  function loadImage(src, cors) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      if (cors) img.crossOrigin = "anonymous";
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error("image")); };
      img.src = src;
    });
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrapLines(ctx, text, maxWidth, maxLines) {
    var words = String(text).replace(/(\d)\s+(zł|PLN|EUR|USD|GBP|€|dni|dni\b|nocy|nocleg\w*)/gi, "$1\u00a0$2").split(/[ \t\n]+/).filter(Boolean), lines = [], i = 0;
    while (i < words.length && lines.length < maxLines) {
      var line = words[i++];
      while (i < words.length && ctx.measureText(line + " " + words[i]).width <= maxWidth) line += " " + words[i++];
      lines.push(line);
    }
    if (i < words.length && lines.length) lines[lines.length - 1] = lines[lines.length - 1].replace(/[\s,.;:\-–—]+$/, "") + "…";
    return lines;
  }

  function ogKeyOf(o) { return [o.title, o.currentPrice, o.currency, o.destination, o.image, o.createdAt, "split-v12",tripShort(o),JSON.stringify(o.pricing||null)].join("|"); }

  var CARD_SIZES = { og: [1200, 630], ig: [1080, 1350], story: [1080, 1920] };

  // mode: "og" (Facebook 1200x630), "ig" (Instagram post 1080x1350), "story" (Stories 1080x1920)
  // vector map pin (no emoji font needed): top-left at x,y, height size
  function drawPin(ctx, x, y, size, color) {
    var r = size * 0.36, cx = x + r + size * 0.04, cy = y + r;
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI * 0.8, Math.PI * 0.2, false);
    ctx.lineTo(cx, y + size);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(cx, cy, r * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

  function ensureOgImage(record) {
    if (!SB.enabled() || !SB.isLoggedIn()) return Promise.resolve(record);
    var key = ogKeyOf(record);
    if (record.ogImage && record.ogKey === key) return Promise.resolve(record);
    var work = renderOgDataUrl(record).then(function (dataUrl) { return SB.uploadDataUrl(dataUrl); }).then(function (url) {
      record.ogImage = url;
      record.ogKey = key;
      return record;
    });
    // never let thumbnail generation block saving (some browsers/shields stall canvas or uploads)
    var limit = new Promise(function (res) { setTimeout(function () { res(record); }, 12000); });
    return Promise.race([work, limit]).catch(function () { return record; });
  }

  function onGlobalPaste(e) {
    if (currentRoute().name !== "admin" || !canEditPage) return;
    var cd = e.clipboardData;
    if (!cd || !cd.items) return;
    var file = null;
    for (var i = 0; i < cd.items.length; i++) {
      if (cd.items[i].type && cd.items[i].type.indexOf("image/") === 0) { file = cd.items[i].getAsFile(); break; }
    }
    if (!file) return;
    if (cd.getData && cd.getData("text/plain")) return; // copied cells/text: let the normal paste happen
    e.preventDefault();

    var ae = document.activeElement;
    var closest = function (sel) { return ae && ae.closest ? ae.closest(sel) : null; };
    // photo of the offer (thumbnail): hand the pasted image to the file input
    if ((closest(".photo-field") || (closest("#advBox") && !closest(".extra-row"))) && byId("f_imageFile")) {
      try {
        var dt = new DataTransfer();
        dt.items.add(file);
        byId("f_imageFile").files = dt.files;
        byId("f_imageFile").dispatchEvent(new Event("change", { bubbles: true }));
      } catch (err) {
        formMsg("err", "Ta przeglądarka nie pozwala wkleić zdjęcia tutaj — użyj przycisku wyboru pliku.");
      }
      return;
    }
    var rows = qsa(".extra-row");
    var rowOk = lastExtraRow && document.body.contains(lastExtraRow) ? lastExtraRow : (rows[rows.length - 1] || null);
    var target = null;
    if (closest(".extra-row")) target = closest(".extra-row");
    else if (closest("#quickForm, .quick-card") && byId("q_shot")) target = "quick";
    else if (closest("#advBox")) {
      target = rowOk;

        var addBtn = qs('[data-add-extra="flight"]');
        if (addBtn) { addBtn.click(); var rs = qsa(".extra-row"); target = rs[rs.length - 1]; }
      }
    } else if (byId("q_shot")) target = "quick";
    else target = rowOk;

    if (target === "quick") placeShot(file, byId("q_shot"), "q-shot-remove", function (url) { quickShot = url; });
    else if (target) {
      placeShot(file, qs(".ex-shot", target), "ex-shot-remove");

      }
    });
    byId("extrasBox").addEventListener("change", function (e) {
      if (e.target.classList.contains("ex-file")) {
        var row0 = e.target.closest(".extra-row");
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!/^image\//.test(file.type)) { formMsg("err", "Wybierz plik graficzny (np. zrzut ekranu w PNG lub JPG)."); return; }
        // Screenshots contain small text, so keep them larger and sharper than photos.
        readAndShrinkImage(file, function (dataUrl) {
          if (!dataUrl) { formMsg("err", "Nie udało się wczytać zrzutu ekranu."); return; }
          qs(".ex-shot", row0).innerHTML = '<img src="' + dataUrl + '" alt=""><button type="button" class="btn ghost small ex-shot-remove">Usuń zrzut</button>';
          byId("formMsg").innerHTML = "";
        }, 1300, 0.86);
        return;
      }
      if (!e.target.classList.contains("ex-type")) return;
      var row = e.target.closest(".extra-row");
      var t = EXTRA_TYPES[e.target.value];
      qs(".ex-a", row).placeholder = t.aPh;
      qs(".ex-b", row).placeholder = t.bPh;
      qs(".ex-unit", row).placeholder = t.unit;
    });

    // --- photo: upload or link ---
    function refreshPreview() {
      byId("imgPreview").innerHTML = imagePreviewHtml();
      var rm = byId("removeImageBtn");
      if (rm) rm.addEventListener("click", function () { draftImage = ""; byId("f_image").value = ""; byId("f_imageFile").value = ""; refreshPreview(); });
    }
    refreshPreview();
    byId("f_image").addEventListener("input", function () {
      draftImage = byId("f_image").value.trim();
      refreshPreview();
    });
    function syncTripLine() {
      var d = byId("f_description");
      d.value = withTripLine(d.value, byId("f_dateFrom").value, byId("f_dateTo").value);
    }
    byId("f_dateFrom").addEventListener("change", function () {
      var to = byId("f_dateTo");
      if (to.value && to.value < this.value) to.value = this.value;
      to.min = this.value || "";
      syncTripLine();
    });
    byId("f_dateTo").addEventListener("change", syncTripLine);
    wirePublish("f");
    byId("f_tplBtn").addEventListener("click", function () {
      var key = byId("f_tpl").value;
      if (!key) { formMsg("err", "Najpierw wybierz szablon z listy."); return; }
      var d = byId("f_description");
      var current = d.value.split("\n").filter(function (l) { return l.indexOf("🗓 Termin wyjazdu") !== 0; }).join("").trim();
      if (current && !window.confirm("Zastąpić obecny opis wybranym szablonem?")) return;
      var text = descTemplate(key, { destination: byId("f_destination").value, currentPrice: parseFloat(byId("f_currentPrice").value) || 0, currency: byId("f_currency").value });
      d.value = withTripLine(text, byId("f_dateFrom").value, byId("f_dateTo").value);
      byId("formMsg").innerHTML = "";
    });
    byId("f_imageFile").addEventListener("change", function () {
      var file = byId("f_imageFile").files && byId("f_imageFile").files[0];
      if (!file) return;
      if (!/^image\//.test(file.type)) { formMsg("err", "Wybierz plik graficzny (JPG, PNG, WebP)."); return; }
      readAndShrinkImage(file, function (dataUrl) {
        if (!dataUrl) { formMsg("err", "Nie udało się wczytać zdjęcia. Spróbuj innego pliku."); return; }
        draftImage = dataUrl;
        byId("f_image").value = "";
        byId("formMsg").innerHTML = "";
        refreshPreview();
      });
    });

    var settingsForm = byId("settingsForm");
    if (settingsForm) {
      settingsForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var newSettings = {
          defaultCarRentalLabel: byId("s_carLabel").value.trim(),
          defaultCarRentalUrl: byId("s_carUrl").value.trim(),
          defaultHotelLabel: byId("s_hotelLabel").value.trim(),
          defaultHotelUrl: byId("s_hotelUrl").value.trim(),
          contactEmail: byId("s_contact").value.trim()
        };
        var urlFields = [["defaultCarRentalUrl", newSettings.defaultCarRentalUrl], ["defaultHotelUrl", newSettings.defaultHotelUrl]];
        for (var i = 0; i < urlFields.length; i++) {
          var val = urlFields[i][1];
          if (val && !/^https?:\/\//i.test(val)) {
            byId("settingsMsg").innerHTML = '<div class="msg err">Link musi zaczynać się od http:// lub https://</div>';
            return;
          }
        }
        saveState(Object.assign({}, state, { settings: newSettings }), function (ok, errText) {
          if (!ok) byId("settingsMsg").innerHTML = '<div class="msg err">' + escapeHtml(errText || "Nie udało się zapisać ustawień.") + "</div>";
        });
      });
    }

    qsa("[data-dup]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        adminDuplicateSlug = btn.getAttribute("data-dup");
        adminEditingSlug = null;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    qsa("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        adminEditingSlug = btn.getAttribute("data-edit");
        adminDuplicateSlug = null;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    qsa("[data-copy]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var url = offerShareUrl(btn.getAttribute("data-copy"));
        var original = btn.textContent;
        function done() { btn.textContent = "Skopiowano!"; setTimeout(function () { btn.textContent = original; }, 1500); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, function () { fallbackCopy(url); done(); });
        } else {
          fallbackCopy(url); done();
        }
      });
    });

    qsa("[data-promote]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var slug = btn.getAttribute("data-promote");
        var panel = byId("promo-" + slug);
        if (!panel) return;
        if (!panel.hidden) { panel.hidden = true; return; }
        var offer = activeOffers().find(function (o) { return o.slug === slug; });
        if (!offer) return;
        panel.hidden = false;
        panel.innerHTML = '<p class="hint">Przygotowuję miniaturkę do udostępnienia…</p>';
        var copy = JSON.parse(JSON.stringify(offer));
        ensureOgImage(copy).then(function (rec) {
          if (rec.ogImage && (rec.ogImage !== offer.ogImage || rec.ogKey !== offer.ogKey)) {
            return SB.upsertOffer(rec).then(function () { offer.ogImage = rec.ogImage; offer.ogKey = rec.ogKey; return rec; }, function () { return rec; });
          }
          return rec;
        }).then(function (rec) { showPromoPanel(panel, rec); });
      });
    });

    qsa("[data-publish]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var slug = btn.getAttribute("data-publish");
        var o = state.offers.find(function (x) { return x.slug === slug; });
        if (!o) return;
        btn.disabled = true;
        var rec = Object.assign({}, o, { status: "published", createdAt: new Date().toISOString() });
        delete rec.publishAt;
        var next = state.offers.map(function (x) { return x.slug === slug ? rec : x; });
        saveState(Object.assign({}, state, { offers: next }), function (ok, errText) {
          if (!ok) { btn.disabled = false; formMsg("err", errText || "Nie udało się opublikować oferty."); }
          else adminFlash = "✅ Opublikowano ofertę „" + escapeHtml(o.title) + "”.";
        });
      });
    });

    qsa("[data-delete]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var slug = btn.getAttribute("data-delete");
        var doomed = state.offers.find(function (o) { return o.slug === slug; });
        var ok = false;
        try {
          ok = window.confirm("Czy na pewno chcesz USUNĄĆ ofertę „" + (doomed ? doomed.title : slug) + "”?\n\nOferta zniknie ze strony i z bazy danych na stałe — nie da się tego cofnąć.");
        } catch (e) { ok = false; }
        if (!ok) return;
        btn.disabled = true;
        var next = state.offers.filter(function (o) { return o.slug !== slug; });
        saveState(Object.assign({}, state, { offers: next }), function (ok, errText) {
          if (!ok) { btn.disabled = false; formMsg("err", errText || "Nie udało się usunąć oferty."); }
        });
      });
    });
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ============================== SAVE / PUBLISH =========================== */

  var canEditPage = false;

  function sameJson(x, y) { return JSON.stringify(x) === JSON.stringify(y); }

  // Compares the new state with the current one and writes only the
  // differences (upsert changed/new offers, delete removed ones). Every
  // changed offer also gets a fresh share thumbnail first.
  function saveState(newState, cb) {
    if (!SB.enabled()) { cb(false, "Baza danych nie jest skonfigurowana (plik config.js)."); return; }
    if (!SB.isLoggedIn()) { cb(false, "Sesja wygasła. Zaloguj się ponownie."); return; }
    var oldBySlug = {};
    state.offers.forEach(function (o) { oldBySlug[o.slug] = o; });
    var newBySlug = {};
    newState.offers.forEach(function (o) { newBySlug[o.slug] = o; });
    var changed = newState.offers.filter(function (o) { return !sameJson(oldBySlug[o.slug], o); });
    Promise.all(changed.map(ensureOgImage)).then(function () {
      var jobs = changed.map(function (o) { return SB.upsertOffer(o); });
      state.offers.forEach(function (o) {
        if (!newBySlug[o.slug]) jobs.push(SB.deleteOffer(o.slug));
      });
      if (!sameJson(state.settings, newState.settings)) jobs.push(SB.saveSettings(newState.settings));
      return Promise.all(jobs);
    }).then(function () {
      state = newState;
      cb(true);
      render();
    }, function (err) {
      var msg = (err && err.message) || "";
      if (err && (err.status === 401 || err.status === 403)) cb(false, "Brak uprawnień lub sesja wygasła. Zaloguj się ponownie.");
      else cb(false, "Nie udało się zapisać zmian" + (msg ? " (" + msg + ")" : "") + ".");
    });
  }

  /* ============================== RENDER SHELL ============================ */

  function shellHtml() {
    return (
      '<header class="site">' +
        '<a class="brand" href="/" aria-label="' + escapeHtml(state.siteName || BRAND) + ' — strona główna"><img class="brand-mark" src="/logo-mark.png" alt="" width="54" height="54">' +
          '<span><span class="brand-word">' + brandWordHtml(state.siteName) + '</span>' + (state.tagline ? '<span class="brand-tag">' + escapeHtml(state.tagline) + "</span>" : "") + "</span></a>" +
        '<nav class="site">' +
          '<button type="button" class="pill" data-nav="home">Oferty</button>' +
          '<button type="button" class="pill admin" data-nav="admin" id="adminNavBtn" hidden>+ Dodaj ofertę</button>' +
          '<button type="button" class="pill" id="logoutBtn" hidden>Wyloguj</button>' +
        "</nav>" +
      "</header>" +
      '<main><div id="view"></div></main>' +
      '<div class="shore">' + shoreSvg() + "</div>" +
      '<footer class="site">' +
        '<span>© ' + new Date().getFullYear() + ' <span class="brand-word">' + brandWordHtml(state.siteName) + "</span></span>" +
        '<span>Strona utrzymuje się z linków afiliacyjnych. · <a class="foot-link" href="/prywatnosc">Polityka prywatności</a></span>' +
        '<span class="foot-social">' + socialIconsHtml(false) + "</span>" +
      "</footer>"
    );
  }

  function render() {
    var route = currentRoute();
    qsa(".pill[data-nav]").forEach(function (p) { p.classList.toggle("is-active", p.getAttribute("data-nav") === route.name); });
    document.title = (state.siteName || BRAND) + " — oferty wyjazdów";
    if (route.name === "admin") renderAdmin(canEditPage);
    else if (route.name === "offer") renderOfferDetail(route.slug, canEditPage);
    else if (route.name === "privacy") renderPrivacy();
    else if (route.name === "links") renderLinks();
    else renderHome(canEditPage);
    window.scrollTo(0, byId("app").dataset.navigated ? window.scrollY : 0);
    byId("app").dataset.navigated = "1";
  }

  /* ============================== INIT ===================================== */

  function init() {
    document.title = (state.siteName || BRAND) + " — oferty wyjazdów";
    var styleTag = document.createElement("style");
    styleTag.textContent = STYLE_CSS;
    document.head.appendChild(styleTag);

    var app = document.createElement("div");
    app.id = "app";
    app.innerHTML = shellHtml();
    document.body.appendChild(app);

    // Wysokość przypiętego nagłówka -> zmienna CSS (pasek filtrów przykleja się tuż pod nim)
    (function () {
      var hd = qs("header.site");
      function setH() { if (hd) document.documentElement.style.setProperty("--hdr-h", Math.round(hd.getBoundingClientRect().height) + "px"); }
      setH(); window.addEventListener("resize", setH); window.addEventListener("orientationchange", setH);
      if (window.ResizeObserver && hd) new ResizeObserver(setH).observe(hd);
    })();

    migrateLegacyHash();
    qs('[data-nav="home"]').addEventListener("click", function () { go("/"); });
    qs('[data-nav="admin"]').addEventListener("click", function () { go("/admin"); });

    // Internal links navigate without reloading the page.
    document.addEventListener("click", function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest ? e.target.closest("a[href]") : null;
      if (!a) return;
      var href = a.getAttribute("href") || "";
      if (a.target === "_blank" && /sponsored/.test(a.rel || "")) {
        var r = currentRoute();
        if (r.name === "offer") SB.track("click", r.slug, (a.textContent || "").replace(/\s+/g, " ").trim());
        return;
      }
      if (href.charAt(0) === "/" && href.charAt(1) !== "/" && !a.target) {
        e.preventDefault();
        go(href);
      }
    });
    document.addEventListener("paste", onGlobalPaste);
    byId("logoutBtn").addEventListener("click", function () {
      SB.logout();
      setEditMode(false);
      go("/");
    });

    if (!SB.enabled()) {
      // No database configured: show the embedded demo offers read-only.
      render();
      return;
    }

    setEditMode(SB.isLoggedIn());
    byId("view").innerHTML = '<div class="empty"><div class="big">⏳</div>Wczytywanie ofert…</div>';
    SB.loadAll().then(function (res) {
      state.offers = res.offers;
      if (res.settings) state.settings = Object.assign(state.settings, res.settings);
      if (res.site) { state.siteName = (res.site.siteName && LEGACY_NAMES.indexOf(res.site.siteName) === -1) ? res.site.siteName : state.siteName; state.tagline = res.site.tagline || state.tagline; }
      render();
    }, function () {
      byId("view").innerHTML = '<div class="empty"><div class="big">⚠️</div>Nie udało się wczytać ofert. Odśwież stronę za chwilę.</div>';
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
